name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Python linting and type checking
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (type checking)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Backend — Unit tests (runs when test files exist)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zolution_test
          POSTGRES_USER: zolution
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Production's role owns the tables without being a superuser, and RLS
      # only proves anything under that same condition.
      - name: Create application role
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U zolution -d postgres \
            -c "CREATE ROLE zolution_app LOGIN PASSWORD 'test_password' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE zolution_rls OWNER zolution_app"

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: zolution_test
          DATABASE_USER: zolution
          DATABASE_PASSWORD: test_password
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+asyncpg://zolution_app:test_password@localhost:5432/zolution_rls
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Frontend — Next.js build check
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
