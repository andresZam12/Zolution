name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Python linting and type checking
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (type checking)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        # Will report errors but not fail the build until app code exists
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Backend — Unit tests (runs when test files exist)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zolution_test
          POSTGRES_USER: zolution
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt yet — skipping install"
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "No requirements-dev.txt yet — skipping install"
          fi

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: zolution_test
          DATABASE_USER: zolution
          DATABASE_PASSWORD: test_password
          APP_ENV: test
        run: |
          if [ -f requirements.txt ] && python -c "import pytest" 2>/dev/null; then
            pytest tests/ -v --tb=short
          else
            echo "No test dependencies yet — skipping tests"
          fi

  # ---------------------------------------------------------------------------
  # Frontend — Angular build check
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Only enable npm cache when package-lock.json exists to avoid
          # the "Dependencies file is not found" error on empty frontend
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline
          else
            echo "No package.json yet — skipping install"
          fi

      - name: Lint
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint
          else
            echo "No lint script yet — skipping"
          fi
        continue-on-error: true

      - name: Build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json 2>/dev/null; then
            npm run build -- --configuration=production
          else
            echo "No package.json yet — skipping build"
          fi
