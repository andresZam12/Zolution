services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — shared schema, RLS enforced
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: zolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zolution}
      POSTGRES_USER: ${POSTGRES_USER:-zolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zolution} -d ${POSTGRES_DB:-zolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zolution_net

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zolution_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override DB host to use the docker service name
      DATABASE_HOST: db
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in development; remove for production
      - ./backend:/app
    networks:
      - zolution_net

  # ---------------------------------------------------------------------------
  # Angular frontend (dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zolution_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "4200:4200"
    volumes:
      # Mount source for hot-reload; node_modules excluded via named volume
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - zolution_net

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  zolution_net:
    driver: bridge
